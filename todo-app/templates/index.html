<!DOCTYPE html>
<html lang="en">
<head>
    <title>NV23163 – Todo App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
    <h1>NV23163 – Todo App</h1>
    <p>Event-Based Task Planner</p>
</header>

<section class="creator">
    <h2>Create Event</h2>

    <form method="POST">
        <input type="text" name="title" placeholder="Event title" required>

        <select name="task_type">
            <option>Work</option>
            <option>Event</option>
            <option>Personal</option>
            <option>Holiday</option>
        </select>

        <select name="status">
            <option>Planned</option>
            <option>In-Progress</option>
            <option>Done</option>
            <option>Cancelled</option>
        </select>

        <label>Start</label>
        <input type="datetime-local" name="start_time" required>

        <label>End</label>
        <input type="datetime-local" name="end_time" required>

        <button>Create Event</button>
    </form>
</section>

<section class="table-section">
    <h2>Schedule</h2>

    <table>
        <thead>
            <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Status</th>
                <th>Start</th>
                <th>End</th>
                <th>Version</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            {% for t in tasks %}
            <tr class="status-{{ t.status | lower }}">
                <td>{{ t.title }}</td>
                <td>{{ t.task_type }}</td>
                <td>{{ t.status }}</td>
                <td>{{ t.start_time }}</td>
                <td>{{ t.end_time }}</td>
                <td>v{{ t.version }}</td>
                <td>
                    <form method="POST" action="/update/{{ t.id }}" class="inline">
                        <input name="title" value="{{ t.title }}">
                        <select name="task_type">
                            <option {{ 'selected' if t.task_type=='Work' }}>Work</option>
                            <option {{ 'selected' if t.task_type=='Event' }}>Event</option>
                            <option {{ 'selected' if t.task_type=='Personal' }}>Personal</option>
                            <option {{ 'selected' if t.task_type=='Holiday' }}>Holiday</option>
                        </select>
                        <select name="status">
                            <option {{ 'selected' if t.status=='Planned' }}>Planned</option>
                            <option {{ 'selected' if t.status=='In-Progress' }}>In-Progress</option>
                            <option {{ 'selected' if t.status=='Done' }}>Done</option>
                            <option {{ 'selected' if t.status=='Cancelled' }}>Cancelled</option>
                        </select>
                        <input type="datetime-local" name="start_time" value="{{ t.start_time }}">
                        <input type="datetime-local" name="end_time" value="{{ t.end_time }}">
                        <button class="update">Update</button>
                    </form>
                    <a class="delete" href="/delete/{{ t.id }}">✖</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</section>

</body>
</html>
