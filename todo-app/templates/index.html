<!DOCTYPE html>
<html>
<head>
    <title>Advanced Todo App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1>Todo Manager</h1>

    <form method="POST" class="add-form">
        <input type="text" name="task" placeholder="Task name" required>

        <select name="priority">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
        </select>

        <input type="date" name="due_date">
        <button>Add Task</button>
    </form>

    <div class="filters">
        <a href="/?filter=all">All</a>
        <a href="/?filter=active">Active</a>
        <a href="/?filter=completed">Completed</a>
    </div>

    <ul>
        {% for todo in todos %}
        <li class="{{ 'done' if todo.completed }}">
            <strong>{{ todo.task }}</strong>
            <span>{{ todo.priority }}</span>
            <span>{{ todo.due_date }}</span>

            {% if not todo.completed %}
                <a href="/complete/{{ todo.id }}">✔</a>
            {% endif %}
            <a href="/delete/{{ todo.id }}">❌</a>

            <form method="POST" action="/edit/{{ todo.id }}" class="edit-form">
                <input name="task" value="{{ todo.task }}">
                <select name="priority">
                    <option {{ 'selected' if todo.priority=='Low' }}>Low</option>
                    <option {{ 'selected' if todo.priority=='Medium' }}>Medium</option>
                    <option {{ 'selected' if todo.priority=='High' }}>High</option>
                </select>
                <input type="date" name="due_date" value="{{ todo.due_date }}">
                <button>Update</button>
            </form>
        </li>
        {% endfor %}
    </ul>
</div>

</body>
</html>
